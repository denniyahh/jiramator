[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiramator"
version = "1.2.8"
description = "Generic, config-driven Jira ticket automation for PI planning and beyond"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "charset-normalizer>=3,<4",
    "click>=8.1",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
jiramator = "jiramator.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["jiramator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["jiramator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are left to judgement (no formatter is enforced); prose and
# f-string messages are often clearer unwrapped.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jiramator"]
